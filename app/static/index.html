<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link
            rel="icon"
            href="https://www.liverpool.ac.uk/rb/assets/favicon.ico"
        />
        <title>Capstone Chat</title>
        <style>
            *,
            *::before,
            *::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            :root {
                --bg: #212121;
                --surface: #2f2f2f;
                --border: #424242;
                --text: #ececec;
                --text-muted: #9a9a9a;
                --accent: #8e8ea0;
                --user-bg: #303030;
                --bot-bg: #2f2f2f;
            }

            body {
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                    sans-serif;
                background: var(--bg);
                color: var(--text);
                height: 100dvh;
                display: flex;
                flex-direction: column;
            }

            header {
                padding: 12px 24px;
                border-bottom: 1px solid var(--border);
                font-weight: 600;
                font-size: 16px;
                text-align: center;
                background: var(--bg);
            }

            #chat-container {
                flex: 1;
                overflow-y: auto;
                padding: 24px 0;
                scroll-behavior: smooth;
            }

            .message {
                max-width: 768px;
                margin: 0 auto;
                padding: 12px 24px;
                display: flex;
                gap: 16px;
                align-items: flex-start;
            }

            .message.user {
                background: var(--user-bg);
            }
            .message.bot {
                background: var(--bot-bg);
            }

            .avatar {
                width: 32px;
                height: 32px;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 14px;
                flex-shrink: 0;
                background: var(--border);
                color: var(--text-muted);
            }

            .message.user .avatar {
                background: #5b5b7a;
                color: #fff;
            }
            .message.bot .avatar {
                background: #1a6b51;
                color: #fff;
            }

            .content {
                line-height: 1.6;
                white-space: pre-wrap;
                padding-top: 4px;
            }
            .content .cursor {
                display: inline-block;
                width: 8px;
                height: 16px;
                background: var(--text);
                margin-left: 2px;
                vertical-align: text-bottom;
                animation: blink 0.7s step-end infinite;
            }
            @keyframes blink {
                50% {
                    opacity: 0;
                }
            }

            #input-area {
                border-top: 1px solid var(--border);
                padding: 16px 24px;
                background: var(--bg);
            }

            #input-row {
                max-width: 768px;
                margin: 0 auto;
                display: flex;
                gap: 8px;
                align-items: flex-end;
            }

            #upload-btn {
                background: none;
                border: 1px solid var(--border);
                color: var(--text-muted);
                border-radius: 8px;
                width: 40px;
                height: 40px;
                cursor: pointer;
                font-size: 20px;
                display: flex;
                align-items: center;
                justify-content: center;
                flex-shrink: 0;
                transition:
                    border-color 0.15s,
                    color 0.15s;
            }
            #upload-btn:hover {
                border-color: var(--text-muted);
                color: var(--text);
            }

            #file-input {
                display: none;
            }

            #input-box {
                flex: 1;
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 12px;
                color: var(--text);
                padding: 10px 16px;
                font-size: 15px;
                font-family: inherit;
                resize: none;
                outline: none;
                max-height: 200px;
                line-height: 1.5;
                transition: border-color 0.15s;
            }
            #input-box:focus {
                border-color: #67678a;
            }
            #input-box::placeholder {
                color: var(--accent);
            }

            #send-btn {
                background: var(--text);
                color: var(--bg);
                border: none;
                border-radius: 8px;
                width: 40px;
                height: 40px;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                flex-shrink: 0;
                transition: opacity 0.15s;
            }
            #send-btn:disabled {
                opacity: 0.3;
                cursor: default;
            }
            #send-btn svg {
                width: 18px;
                height: 18px;
            }

            #upload-status {
                max-width: 768px;
                margin: 8px auto 0;
                font-size: 13px;
                color: var(--text-muted);
                min-height: 20px;
                padding: 0 24px;
            }

            .empty-state {
                flex: 1;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                color: var(--text-muted);
                gap: 8px;
            }
            .empty-state .icon {
                font-size: 48px;
                opacity: 0.4;
            }
            .empty-state p {
                font-size: 15px;
            }
        </style>
    </head>
    <body>
        <header>Capstone Chat</header>

        <div id="chat-container">
            <div class="empty-state" id="empty-state">
                <div class="icon">&#x1F4C4;</div>
                <p>Upload a PDF and start chatting.</p>
            </div>
        </div>

        <div id="input-area">
            <div id="upload-status"></div>
            <div id="input-row">
                <button id="upload-btn" title="Upload PDF">&#x2B;</button>
                <input type="file" id="file-input" accept=".pdf" />
                <textarea
                    id="input-box"
                    rows="1"
                    placeholder="Message..."
                    autofocus
                ></textarea>
                <button id="send-btn" disabled title="Send">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
                    </svg>
                </button>
            </div>
        </div>

        <script>
            const chatContainer = document.getElementById("chat-container");
            const emptyState = document.getElementById("empty-state");
            const inputBox = document.getElementById("input-box");
            const sendBtn = document.getElementById("send-btn");
            const uploadBtn = document.getElementById("upload-btn");
            const fileInput = document.getElementById("file-input");
            const uploadStatus = document.getElementById("upload-status");

            function scrollToBottom() {
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }

            function enableSend() {
                sendBtn.disabled = !inputBox.value.trim();
            }

            function addMessage(role, text) {
                emptyState.remove();
                const div = document.createElement("div");
                div.className = `message ${role}`;
                const label = role === "user" ? "U" : "AI";
                div.innerHTML = `
    <div class="avatar">${label}</div>
    <div class="content">${escapeHtml(text)}</div>`;
                chatContainer.appendChild(div);
                scrollToBottom();
                return div;
            }

            function escapeHtml(s) {
                return s
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;");
            }

            inputBox.addEventListener("input", () => {
                inputBox.style.height = "auto";
                inputBox.style.height =
                    Math.min(inputBox.scrollHeight, 200) + "px";
                enableSend();
            });

            inputBox.addEventListener("keydown", (e) => {
                if (e.key === "Enter" && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            sendBtn.addEventListener("click", sendMessage);

            uploadBtn.addEventListener("click", () => fileInput.click());

            fileInput.addEventListener("change", async () => {
                const file = fileInput.files[0];
                if (!file) return;
                uploadStatus.textContent = `Uploading ${file.name}...`;
                const fd = new FormData();
                fd.append("file", file);
                try {
                    const res = await fetch("/upload", {
                        method: "POST",
                        body: fd,
                    });
                    const data = await res.json();
                    uploadStatus.textContent = `Uploaded ${data.filename} (${(data.size / 1024).toFixed(1)} KB)`;
                } catch {
                    uploadStatus.textContent = "Upload failed.";
                }
                fileInput.value = "";
            });

            async function sendMessage() {
                const text = inputBox.value.trim();
                if (!text) return;
                inputBox.value = "";
                inputBox.style.height = "auto";
                enableSend();

                addMessage("user", text);

                const botDiv = document.createElement("div");
                botDiv.className = "message bot";
                botDiv.innerHTML = `
    <div class="avatar">AI</div>
    <div class="content"><span class="cursor"></span></div>`;
                emptyState.remove();
                chatContainer.appendChild(botDiv);
                const contentEl = botDiv.querySelector(".content");
                let buffer = "";

                try {
                    const res = await fetch("/chat", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ message: text }),
                    });
                    const reader = res.body.getReader();
                    const decoder = new TextDecoder();
                    let done = false;

                    while (!done) {
                        const { value, done: d } = await reader.read();
                        done = d;
                        if (done) break;
                        const chunk = decoder.decode(value, { stream: true });
                        for (const line of chunk.split("\n")) {
                            if (!line.startsWith("data: ")) continue;
                            const payload = line.slice(6);
                            if (payload === "[DONE]") {
                                done = true;
                                break;
                            }
                            buffer += payload;
                            contentEl.innerHTML =
                                escapeHtml(buffer) +
                                '<span class="cursor"></span>';
                            scrollToBottom();
                        }
                    }
                    contentEl.textContent = buffer;
                } catch {
                    contentEl.textContent = "Error: could not reach server.";
                }
            }
        </script>
    </body>
</html>
